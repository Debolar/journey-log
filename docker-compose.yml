name: journey-log
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: journey     # fine for local practice; real secrets come in Milestone 3
      POSTGRES_DB: journeylog
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journey -d journeylog"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://journey:journey@db:5432/journeylog
      APP_ENV: docker
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data: