server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Send API requests to the backend container
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # Serve the website files
    location / {
        try_files $uri $uri/ /index.html;
    }
}